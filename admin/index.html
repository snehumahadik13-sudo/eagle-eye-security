<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Eagle Eye Security</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Eagle Eye Security</h1>
      <p>Admin dashboard sign in</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  // If already signed in, skip straight to dashboard
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
      window.location.href = 'dashboard.html';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('loginBtn');

    errorMsg.textContent = '';
    btn.textContent = 'Signing in…';
    btn.disabled = true;

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      errorMsg.textContent = error.message;
      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    // Confirm this account is actually an allowed admin
    const res = await fetch(`${API_BASE_URL}/api/admin/me`, {
      headers: {
        Authorization: `Bearer ${data.session.access_token}`
      }
    });

    if (!res.ok) {
      errorMsg.textContent =
        'This account is not authorized as an admin.';

      await supabaseClient.auth.signOut();

      btn.textContent = 'Sign In';
      btn.disabled = false;
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
